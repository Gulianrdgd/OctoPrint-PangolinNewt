[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-PangolinNewt"
version = "0.4.0"
description = "Pangolin Newt Client for OctoPrint: reach your printer through Pangolin, no terminal needed"
authors = [
    {name = "Gulianrdgd", email = "julianvanderhorst2001@googlemail.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = [
    "license"
]

requires-python = ">=3.7, <4"
dependencies = []

[project.optional-dependencies]
develop = ["OctoPrint", "pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_pangolin_newt",
    "octoprint_pangolin_newt.*"
]

[project.entry-points."octoprint.plugin"]
pangolin_newt = "octoprint_pangolin_newt"

[project.urls]
Homepage = "https://github.com/Gulianrdgd/OctoPrint-PangolinNewt"
